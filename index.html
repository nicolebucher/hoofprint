<style>
/* Layout: one-screen app. White top bar, list/detail sidebar beside a full-height map; stacks map over panel on phones. */
:root{
  --bg:#f5f8f7; --surface:#ffffff; --surface-2:#eef4f3; --line:#dce5e3;
  --fg:#11201f; --muted:#5b6d6b; --accent:#0e5e5f; --accent-hover:#0b4d4e; --accent-fg:#ffffff; --accent-soft:#e0efed;
  --brass:#d08a1f; --heart:#d64545;
  --easy:#1f7a4d; --mid:#b46a00; --hard:#c23b2e;
  --route:#0e6e6f; --route-sel:#e2603a; --route-case:#ffffff;
  --shadow:0 1px 2px rgba(14,40,40,.06),0 8px 24px rgba(14,40,40,.08);
  --f-display:"Inter Tight","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#12201f; --surface-2:#1a2c2b; --line:#273b39;
  --fg:#e5efed; --muted:#94a9a6; --accent:#4cbdb8; --accent-hover:#6fd0cb; --accent-fg:#052120; --accent-soft:#16393a;
  --brass:#f0b44f; --heart:#ff7a72;
  --easy:#5fd396; --mid:#f2a43a; --hard:#ff7f73;
  --route:#4cbdb8; --route-sel:#ff8a5c; --route-case:#0a1312;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#12201f; --surface-2:#1a2c2b; --line:#273b39;
  --fg:#e5efed; --muted:#94a9a6; --accent:#4cbdb8; --accent-hover:#6fd0cb; --accent-fg:#052120; --accent-soft:#16393a;
  --brass:#f0b44f; --heart:#ff7a72;
  --easy:#5fd396; --mid:#f2a43a; --hard:#ff7f73;
  --route:#4cbdb8; --route-sel:#ff8a5c; --route-case:#0a1312;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }

/* Leaflet overrides */
.leaflet-touch .leaflet-bar,.leaflet-bar{box-shadow:var(--shadow);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{display:block;width:34px;height:34px;line-height:34px;text-align:center;text-decoration:none;background:var(--surface);color:var(--fg);font:600 18px/34px var(--f-body);border-bottom:1px solid var(--line)}
.poictl{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;max-width:calc(100vw - 80px)}.poiitem{display:grid;gap:4px;justify-items:start}.poictl .poibtn{box-shadow:var(--shadow);border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;background:var(--surface);color:var(--fg);font:600 14px var(--f-body);cursor:pointer;user-select:none}.poibtn input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}.poictl .poibtn:hover{background:var(--surface-2)}.poictl .poibtn.on{border-color:var(--accent)}.poictl .cnt{background:var(--accent);color:var(--accent-fg);border-radius:9px;padding:0 6px;font-size:12px;line-height:18px}.poictl .poibtn.busy{opacity:.75;cursor:progress}
.poipin.stations{border-color:#0e5e5f}
.poihint{max-width:180px!important;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:5px 10px;font:500 13px var(--f-body);max-width:220px}
.poipin{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #b5651d;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;font-size:14px;line-height:1}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);font-size:11px;padding:2px 6px;margin:0!important}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);font:600 13px var(--f-body)}
.leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none}
.leaflet-div-icon{background:transparent;border:none}
/* --- App --- */
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font:700 24px/1 var(--f-display);margin:0;letter-spacing:.2px}
.brand small{display:block;font:500 12px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.main{display:grid;grid-template-columns:minmax(340px,420px) 1fr;min-height:0}
.panel{background:var(--surface);border-right:1px solid var(--line);overflow:auto;min-height:0;min-width:0}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--map-ground)}
@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:44svh 1fr}
  .mapwrap{order:-1}
  .panel{border-right:none;border-top:1px solid var(--line)}
  .brand small{display:none}
  header.top .btn .lbl{display:none}
  .maphint{display:none}
  .tab{padding-inline:6px}
}
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.tab{white-space:nowrap;border:none;background:none;padding:8px 10px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:15px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-size:12px;background:var(--surface-2);border-radius:10px;padding:1px 7px;margin-left:4px;font-variant-numeric:tabular-nums}
.filters{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.search input{border:none;background:transparent;padding:9px 0;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:6px}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row select{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px}
.list{display:grid}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.card:hover,.card.hover{background:var(--surface-2)}
.thumb{width:76px;height:76px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:block}
.card h3{font:600 18px/1.2 var(--f-display);margin:0 0 2px;text-wrap:balance}
.card .meta{font-size:13px;color:var(--muted)}
.card .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.d-leicht{color:var(--easy)}.d-mittel{color:var(--mid)}.d-schwer{color:var(--hard)}
.stars{color:var(--brass);letter-spacing:1px;white-space:nowrap}
.src{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted);display:grid;gap:10px;justify-items:start}
.empty strong{color:var(--fg);font:600 18px var(--f-display)}

/* detail */
.detail{padding:0 0 32px}
.dhead{padding:12px 16px 4px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line)}
.dhead .sp{margin-left:auto}
.dbody{padding:16px;display:grid;gap:20px}
.dtitle h2{font:700 28px/1.1 var(--f-display);margin:6px 0 4px;text-wrap:balance}
.dtitle .meta{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:10px 8px}
.kpi b{display:block;font:600 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
section h4{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.prof svg{width:100%;height:auto;display:block}
.surf{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feat{display:flex;flex-wrap:wrap;gap:6px}
.feat span{font-size:13px;background:var(--surface-2);border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:6px}
.feat svg{width:14px;height:14px}
.desc{max-width:65ch;margin:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding:4px 10px;background:var(--bg);border-radius:0 6px 6px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{padding:0;border:none;background:none;cursor:zoom-in;position:relative}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.gallery .tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.uploader{border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;aspect-ratio:1;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:6px}
.uploader:hover{border-color:var(--accent);color:var(--accent)}
.reviews{display:grid;gap:12px}
.rev{border-top:1px solid var(--line);padding-top:10px}
.rev .who{font-weight:600}.rev .when{color:var(--muted);font-size:13px}
.rev p{margin:4px 0 0;max-width:65ch}
.rating-sum{display:flex;align-items:baseline;gap:10px}
.rating-sum b{font:700 32px var(--f-display);font-variant-numeric:tabular-nums}
form.revform{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.starpick{display:flex;gap:2px}
.starpick button{border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--brass)}
input.txt,textarea.txt,select.txt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%}
textarea.txt{min-height:70px;resize:vertical}
.fav[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart)}

/* map overlays */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--route);border:2px solid var(--route-case);box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.pin svg{transform:rotate(45deg);width:15px;height:15px;fill:none;stroke:var(--route-case);stroke-width:2.4;stroke-linecap:round}
.pin.sel{background:var(--route-sel)}
.vtx{width:12px;height:12px;border-radius:50%;background:var(--route-sel);border:2px solid var(--route-case)}
.maphint{position:absolute;left:12px;bottom:28px;z-index:900;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:calc(100% - 24px)}
.drawbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:950;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px);font-size:14px}
.drawbar b{font-variant-numeric:tabular-nums}
.maperr{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:16px;text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,14,11,.5);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:20px;display:grid;gap:14px;min-width:0}
.dialog h3{font:700 22px var(--f-display);margin:0}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:16px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.srcs span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--hard);font-size:14px;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-height:90%;max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2200;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.about ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.copybox{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.leaflet-control-layers{background:var(--surface);color:var(--fg);border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:var(--shadow)!important;font:14px var(--f-body)}
.leaflet-control-layers-expanded{padding:8px 10px}
.mode{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--fg)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.loading{padding:28px 16px;color:var(--muted)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:brightness(.8) saturate(.9)}}

/* --- refresh --- */
header.top{box-shadow:0 1px 0 var(--line);border-bottom:none;padding-block:12px}
.logo{border-radius:12px;box-shadow:0 0 0 1px var(--line),0 2px 8px rgba(14,60,60,.12);flex:none}
.brand h1{font:800 26px/1 var(--f-display);letter-spacing:-.01em;color:var(--fg)}
.brand small{letter-spacing:.02em;text-transform:none;font-size:13px}
.btn{border-radius:10px;padding:8px 14px;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.primary:hover{filter:none;background:var(--accent-hover);border-color:var(--accent-hover)}
.mode{border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.panel{background:var(--surface)}
.tabs{gap:2px;padding:12px 16px;border-bottom:none;overflow-x:auto}
.tab{border:none;border-radius:999px;padding:7px 11px;margin:0;color:var(--muted);background:transparent}
.tab[aria-selected="true"]{background:var(--fg);color:var(--surface)}
.tab[aria-selected="true"] .count{background:color-mix(in srgb,var(--surface) 22%,transparent);color:var(--surface)}
.filters{padding:4px 16px 16px;border-bottom:1px solid var(--line)}
.search{border-radius:12px;background:var(--surface-2);border-color:transparent;padding:0 12px}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.chip{border-color:var(--line);color:var(--fg);font-weight:600;padding:5px 12px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card{grid-template-columns:92px 1fr;gap:14px;padding:14px 16px;transition:background .15s}
.thumb{width:92px;height:92px;border-radius:12px}
.card h3{font:700 19px/1.15 var(--f-display);letter-spacing:-.005em;margin:2px 0}
.src{letter-spacing:.05em;color:var(--accent)}
.pill{border:none;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,currentColor 13%,transparent);letter-spacing:.04em}
.dhead{border-bottom:1px solid var(--line)}
.dtitle h2{font:800 32px/1.05 var(--f-display);letter-spacing:-.01em}
.kpis{border-radius:var(--r);gap:0;background:var(--surface-2);border:none}
.kpi{background:transparent;padding:12px 10px}
.kpi b{font:700 22px/1.1 var(--f-display)}
section h4{color:var(--fg);letter-spacing:.06em}
.feat span{border-radius:999px;background:var(--accent-soft);color:var(--fg);padding:5px 11px}
.feat svg{color:var(--accent)}
.note{border-left-color:var(--accent);background:var(--surface-2)}
.gallery img{border-radius:10px}
.uploader{border-radius:10px}
form.revform{background:var(--surface-2);border:none}
.rating-sum b{font:800 36px var(--f-display)}
.dialog{border-radius:18px}
.dialog h3{font:800 24px var(--f-display);letter-spacing:-.005em}

.ride{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:14px}.ride p{margin:0}.ride .linkbtn{justify-self:start}.conds{display:flex;flex-wrap:wrap;gap:6px}.conds span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px}

.hplist{display:grid}.hprow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}.hprow a{font-weight:600;color:var(--fg)}.hprow .linkbtn{margin-left:auto}

.navoff{color:var(--hard);font-weight:700}
.navbar{gap:6px;padding:8px 12px;bottom:12px}.navbar .recstats b{font-size:20px}.navbar .rechint{font-size:13px;text-align:center}.navbar .recbtns .btn{padding:6px 10px;min-height:0}

.exrow h2{font:800 24px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.exrow .muted{font-size:14px;white-space:nowrap}

.exsearch .search{flex:1;min-width:0}

.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}

.actions.spread{justify-content:space-between}

.drawer a:hover,.drawer>button:hover{background:var(--surface-2)}

@keyframes blink{50%{opacity:.25}}
.rechint{font-size:13px;color:var(--muted);text-align:center}
.me{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}

/* --- design refresh 2: calmer weights, contour hero, cleaner cards --- */
:root{--bg:#f4f6f4;--line:#e1e7e5;--surface-2:#eff3f2;--fg:#0f1c1b;--muted:#5c6c6a;--r:16px;
  --shadow:0 1px 2px rgba(15,40,38,.05),0 6px 20px rgba(15,40,38,.07);--ring:0 0 0 1px var(--line)}
body{-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.brand h1{font:700 22px/1 var(--f-display);letter-spacing:-.01em}
.brand small{font-size:12.5px}
.btn{min-height:40px;font-weight:600}
.btn svg{flex:none}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--surface);padding:64px 16px 52px}
.topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.topo path{fill:none;stroke:var(--accent);stroke-width:1.1;opacity:.16}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 55%,var(--surface))}
.heroin{position:relative;z-index:1;max-width:1100px;gap:18px}
.heroin>h2,.heroin>p{max-width:640px}
.heroin>.regionbox{max-width:680px}
.hero h2{font:700 clamp(34px,5.4vw,58px)/1.02 var(--f-display);letter-spacing:-.025em}
.hero p{font-size:18px;line-height:1.5}
.regionbox{border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,40,38,.06),0 12px 32px rgba(15,40,38,.10);border-radius:14px}
.regionbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent),0 12px 32px rgba(15,40,38,.10)}
.regionbox input{font-size:17px}
.btn.big{border-radius:10px}
.quick .chip{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(4px)}
/* home sections */
.hsec{padding-top:44px}
.sechead h3,.how h3{font:700 24px/1.15 var(--f-display);letter-spacing:-.015em}
.sechead a{font-size:15px}
.topgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tile{border:none;box-shadow:var(--ring);border-radius:16px}
.tile:hover{box-shadow:var(--ring),var(--shadow)}
.tbody{padding:14px 16px 16px;gap:4px}
.tile h4{font:650 18px/1.2 var(--f-display);letter-spacing:-.01em;margin:6px 0 0}
.tstats{display:flex;gap:14px;color:var(--fg);font-weight:500;padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}
.how li{border:none;box-shadow:var(--ring)}
.how li::before{font-weight:700;background:var(--accent-soft);color:var(--accent)}
.how li b{font:650 17px var(--f-display)}
/* list + detail */
.exrow h2{font:700 22px/1.1 var(--f-display);letter-spacing:-.015em}
.card h3{font:650 17px/1.2 var(--f-display);letter-spacing:-.01em}
.card .stats{gap:6px 12px;align-items:center}
.src{font-size:10.5px;color:var(--muted);letter-spacing:.07em}
.dtitle h2{font:700 30px/1.08 var(--f-display);letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:none;border:1px solid var(--line);border-radius:14px}
.kpi{padding:12px 14px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:none}
.kpi b{font:650 22px/1.1 var(--f-display);letter-spacing:-.01em}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:none}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
section h4{font:650 16px/1.3 var(--f-display);text-transform:none;letter-spacing:-.005em;color:var(--fg);margin:0 0 10px}
.dbody{gap:26px}
.dbody>section+section{border-top:1px solid var(--line);padding-top:22px}
.feat span{background:var(--surface-2);font-weight:500}
.rides{border-radius:14px}
.ekpi,.hpkpis .kpi{border:1px solid var(--line);background:var(--surface)}
.ekpi .eic{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ekpi b,.hpkpis .kpi b{font:650 22px var(--f-display)}
.rating-sum b{font:700 34px var(--f-display);letter-spacing:-.02em}
/* map controls */
.poictl .poibtn{border-radius:10px;font-weight:600;height:36px}
.poiic{display:flex;color:var(--accent)}
.poiic svg{width:16px;height:16px}
.hp-page h2,.legal h2{font-weight:700;letter-spacing:-.02em}
.dialog h3{font-weight:700}
/* hoof ratings */
.stars{color:var(--accent);letter-spacing:0;display:inline-flex;align-items:center;gap:4px}
.hoofs{display:inline-flex;gap:.15em;color:var(--accent)}
.hf{width:1em;height:1em;fill:currentColor;transform:rotate(-12deg);flex:none}
.hf.off{fill:var(--line)}
.starpick{gap:4px}
.starpick button{color:var(--line);padding:2px;display:grid;place-items:center;transition:color .12s,transform .12s}
.starpick button:hover{transform:scale(1.08)}
.starpick button.on{color:var(--accent)}
.starpick .hf{width:28px;height:28px;fill:currentColor}
.rating-sum{align-items:center}
.brand .oo{fill:var(--accent);vertical-align:-1px;margin:0 1px}
.dhead .btn{padding:8px 11px;min-height:38px}
.kpi span{white-space:nowrap}
.hero h2{letter-spacing:-.02em}
</style>
</head>
