<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoofprint – Riding routes</title>
<meta name="description" content="Find, share and rate horse riding routes. Import rides from Komoot, Strava, Garmin or Equilab. Reitrouten finden, teilen und bewerten.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='16' fill='%232b4a9c'/%3E%3Cpath d='M10 25V15a7 7 0 0 1 14 0v10' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Sidebar (list ↔ detail) beside a full-height sketch map; stacks map-over-panel on phones. */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --surface-2:#e3e8dc; --line:#cdd5c4;
  --fg:#1d261f; --muted:#5b6858; --accent:#2b4a9c; --accent-fg:#ffffff; --accent-soft:#dde4f5;
  --brass:#b07d1e; --heart:#c0392b;
  --easy:#2f7d43; --mid:#b26b00; --hard:#b3261e;
  --route:#2b4a9c; --route-sel:#d2531a; --route-case:#ffffff;
  --map-ground:#e6ebdd; --map-meadow:#d5e3bd; --map-field1:#e9e2bf; --map-field2:#dfe6b9; --map-field3:#cfdca9; --map-forest:#8fb27c; --map-forest2:#7aa16a; --map-water:#a8c8e2; --map-outline:#8c9a82;
  --shadow:0 1px 2px rgba(29,38,31,.08),0 6px 20px rgba(29,38,31,.08);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a16; --surface:#1b231e; --surface-2:#253029; --line:#34413a;
  --fg:#e7ede4; --muted:#9fae9c; --accent:#8fa8ef; --accent-fg:#0f1830; --accent-soft:#25304d;
  --brass:#e0b257; --heart:#ff7a6b;
  --easy:#6cc785; --mid:#f0a63a; --hard:#ff7d74;
  --route:#8fa8ef; --route-sel:#ff9a5c; --route-case:#0f1512;
  --map-ground:#1d2620; --map-meadow:#24301f; --map-field1:#2e2f22; --map-field2:#2a3221; --map-field3:#26301d; --map-forest:#1a3220; --map-forest2:#15291a; --map-water:#1d3448; --map-outline:#5a6a5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a16; --surface:#1b231e; --surface-2:#253029; --line:#34413a;
  --fg:#e7ede4; --muted:#9fae9c; --accent:#8fa8ef; --accent-fg:#0f1830; --accent-soft:#25304d;
  --brass:#e0b257; --heart:#ff7a6b;
  --easy:#6cc785; --mid:#f0a63a; --hard:#ff7d74;
  --route:#8fa8ef; --route-sel:#ff9a5c; --route-case:#0f1512;
  --map-ground:#1d2620; --map-meadow:#24301f; --map-field1:#2e2f22; --map-field2:#2a3221; --map-field3:#26301d; --map-forest:#1a3220; --map-forest2:#15291a; --map-water:#1d3448; --map-outline:#5a6a5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark }

/* Leaflet overrides */
.leaflet-touch .leaflet-bar,.leaflet-bar{box-shadow:var(--shadow);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.leaflet-touch .leaflet-bar a,.leaflet-bar a{display:block;width:34px;height:34px;line-height:34px;text-align:center;text-decoration:none;background:var(--surface);color:var(--fg);font:600 18px/34px var(--f-body);border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);font-size:11px;padding:2px 6px;margin:0!important}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow);font:600 13px var(--f-body)}
.leaflet-tooltip-top:before,.leaflet-tooltip-bottom:before,.leaflet-tooltip-left:before,.leaflet-tooltip-right:before{display:none}
.leaflet-div-icon{background:transparent;border:none}
/* --- App --- */
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand h1{font:700 24px/1 var(--f-display);margin:0;letter-spacing:.2px}
.brand small{display:block;font:500 12px/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.main{display:grid;grid-template-columns:minmax(340px,420px) 1fr;min-height:0}
.panel{background:var(--surface);border-right:1px solid var(--line);overflow:auto;min-height:0;min-width:0}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--map-ground)}
@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:44svh 1fr}
  .mapwrap{order:-1}
  .panel{border-right:none;border-top:1px solid var(--line)}
  .brand small{display:none}
  header.top .btn .lbl{display:none}
  .maphint{display:none}
  .tab{padding-inline:6px}
}
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.tab{white-space:nowrap;border:none;background:none;padding:8px 10px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:15px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .count{font-size:12px;background:var(--surface-2);border-radius:10px;padding:1px 7px;margin-left:4px;font-variant-numeric:tabular-nums}
.filters{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.search input{border:none;background:transparent;padding:9px 0;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:6px}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row select{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px}
.list{display:grid}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.card:hover,.card.hover{background:var(--surface-2)}
.thumb{width:76px;height:76px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:block}
.card h3{font:600 18px/1.2 var(--f-display);margin:0 0 2px;text-wrap:balance}
.card .meta{font-size:13px;color:var(--muted)}
.card .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.d-leicht{color:var(--easy)}.d-mittel{color:var(--mid)}.d-schwer{color:var(--hard)}
.stars{color:var(--brass);letter-spacing:1px;white-space:nowrap}
.src{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted);display:grid;gap:10px;justify-items:start}
.empty strong{color:var(--fg);font:600 18px var(--f-display)}

/* detail */
.detail{padding:0 0 32px}
.dhead{padding:12px 16px 4px;display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--surface);z-index:5;border-bottom:1px solid var(--line)}
.dhead .sp{margin-left:auto}
.dbody{padding:16px;display:grid;gap:20px}
.dtitle h2{font:700 28px/1.1 var(--f-display);margin:6px 0 4px;text-wrap:balance}
.dtitle .meta{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:10px 8px}
.kpi b{display:block;font:600 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
section h4{font:600 13px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.prof svg{width:100%;height:auto;display:block}
.surf{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feat{display:flex;flex-wrap:wrap;gap:6px}
.feat span{font-size:13px;background:var(--surface-2);border-radius:6px;padding:4px 9px;display:inline-flex;align-items:center;gap:6px}
.feat svg{width:14px;height:14px}
.desc{max-width:65ch;margin:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding:4px 10px;background:var(--bg);border-radius:0 6px 6px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{padding:0;border:none;background:none;cursor:zoom-in;position:relative}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.gallery .tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.uploader{border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;aspect-ratio:1;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:6px}
.uploader:hover{border-color:var(--accent);color:var(--accent)}
.reviews{display:grid;gap:12px}
.rev{border-top:1px solid var(--line);padding-top:10px}
.rev .who{font-weight:600}.rev .when{color:var(--muted);font-size:13px}
.rev p{margin:4px 0 0;max-width:65ch}
.rating-sum{display:flex;align-items:baseline;gap:10px}
.rating-sum b{font:700 32px var(--f-display);font-variant-numeric:tabular-nums}
form.revform{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.starpick{display:flex;gap:2px}
.starpick button{border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--brass)}
input.txt,textarea.txt,select.txt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%}
textarea.txt{min-height:70px;resize:vertical}
.fav[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart)}

/* map overlays */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--route);border:2px solid var(--route-case);box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.pin svg{transform:rotate(45deg);width:15px;height:15px;fill:none;stroke:var(--route-case);stroke-width:2.4;stroke-linecap:round}
.pin.sel{background:var(--route-sel)}
.vtx{width:12px;height:12px;border-radius:50%;background:var(--route-sel);border:2px solid var(--route-case)}
.maphint{position:absolute;left:12px;bottom:28px;z-index:900;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:calc(100% - 24px)}
.drawbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:950;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px);font-size:14px}
.drawbar b{font-variant-numeric:tabular-nums}
.maperr{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:16px;text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,14,11,.5);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:20px;display:grid;gap:14px;min-width:0}
.dialog h3{font:700 22px var(--f-display);margin:0}
.dialog p{margin:0;color:var(--muted);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:16px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.srcs span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--hard);font-size:14px;font-weight:600}
.lightbox{position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-height:90%;max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2200;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.about ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.copybox{width:100%;min-height:120px;font:12px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.leaflet-control-layers{background:var(--surface);color:var(--fg);border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:var(--shadow)!important;font:14px var(--f-body)}
.leaflet-control-layers-expanded{padding:8px 10px}
.mode{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.linkbtn{border:none;background:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--fg)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.loading{padding:28px 16px;color:var(--muted)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:brightness(.8) saturate(.9)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="var(--accent)"/><path d="M10 25V15a7 7 0 0 1 14 0v10" fill="none" stroke="var(--accent-fg)" stroke-width="3.2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.1" fill="var(--accent)"/><g fill="var(--accent)"><circle cx="10" cy="18.5" r="1"/><circle cx="24" cy="18.5" r="1"/><circle cx="10" cy="22.5" r="1"/><circle cx="24" cy="22.5" r="1"/></g></svg>
      <div><h1>Hoofprint</h1><small data-i18n="tagline">Find, share and rate riding routes</small></div>
    </div>
    <span class="mode" id="mode">…</span>
    <button class="btn ghost" id="btnLang" style="font-weight:700;letter-spacing:.04em">DE</button>
    <button class="btn" id="btnDraw" data-i18n-title="drawTitle" title="Draw a route on the map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg><span class="lbl" data-i18n="draw">Draw route</span></button>
    <button class="btn primary" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg><span class="lbl" data-i18n="import">Import route</span></button>
    <button class="btn ghost" id="btnAbout" data-i18n-title="about" title="About Hoofprint" aria-label="About Hoofprint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
  </header>
  <div class="main">
    <aside class="panel" id="panel"></aside>
    <div class="mapwrap">
      <div id="map"></div>
      
    </div>
  </div>
</div>
<input type="file" id="fileRoute" accept=".gpx,.kml,.geojson,.json,application/gpx+xml" hidden>
<input type="file" id="filePhoto" accept="image/*" multiple hidden>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
